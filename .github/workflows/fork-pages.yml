name: "Fork: Deploy to GitHub Pages"

# Fork-only deployment. Builds the web app and force-pushes it to the
# gh-pages branch with plain git (Settings → Pages → Source: "Deploy from a
# branch", gh-pages, / (root)).
# Unlike upstream's master.yml, this skips copy:ghPages so GCHQ's Google
# Analytics tag and structured data are not injected into the fork's site.

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'gchq/CyberChef'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max_old_space_size=4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Production Build
        run: npx grunt prod --msg=""

      - name: Generate sitemap
        run: |
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed -i "s|https://gchq.github.io/CyberChef/|${BASE_URL}|" src/web/static/sitemap.mjs
          npx grunt exec:sitemap

      - name: Push to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: build/prod
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA} to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
